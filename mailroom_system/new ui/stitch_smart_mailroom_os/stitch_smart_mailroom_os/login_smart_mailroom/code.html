<style>
        .glass-card {
            background: rgba(22, 22, 24, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glow-border:focus-within {
            border-color: #4b8eff;
            box-shadow: 0 0 15px rgba(75, 142, 255, 0.2);
        }
        .bg-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .btn-gradient {
            background: linear-gradient(180deg, #4b8eff 0%, #005bc1 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface font-body-md overflow-hidden">
<!-- Futuristic Background Layer -->
<div class="fixed inset-0 z-0 bg-grid">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex min-h-screen flex-col items-center justify-center p-6">
<!-- Brand Header -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center mb-4 p-3 rounded-2xl bg-primary-container/10 border border-primary-container/20">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="package_2">package_2</span>
</div>
<h1 class="font-display-xl text-display-xl tracking-tighter text-white uppercase">
                Smart Mailroom
            </h1>
<p class="text-on-surface-variant font-body-md mt-2">
                Secure Enterprise Logistics Hub
            </p>
</div>
<!-- Login Card -->
<div class="glass-card w-full max-w-[440px] rounded-[2rem] p-10 flex flex-col items-center">
<!-- Login Tabs -->
<div class="flex w-full bg-surface-container-low rounded-xl p-1.5 mb-8">
<button class="flex-1 py-2.5 rounded-lg font-label-caps text-label-caps text-primary bg-primary-container/10 transition-all duration-300">
                    Admin Login
                </button>
<button class="flex-1 py-2.5 rounded-lg font-label-caps text-label-caps text-zinc-500 hover:text-zinc-300 transition-all duration-300">
                    Student Login
                </button>
</div>
<!-- Form -->
<form class="w-full space-y-6">
<div class="space-y-1.5">
<label class="text-zinc-400 font-label-caps text-xs px-1" for="identifier">ADMIN ID OR EMAIL</label>
<div class="relative flex items-center glow-border border border-white/5 bg-white/5 rounded-xl transition-all duration-300 group">
<span class="material-symbols-outlined absolute left-4 text-zinc-500 group-focus-within:text-primary" data-icon="person">person</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-white placeholder-zinc-600 focus:ring-0 font-body-md" id="identifier" placeholder="Enter credentials" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-zinc-400 font-label-caps text-xs" for="password">PASSWORD</label>
<a class="text-primary/70 hover:text-primary font-label-caps text-[10px] transition-colors" href="#">FORGOT?</a>
</div>
<div class="relative flex items-center glow-border border border-white/5 bg-white/5 rounded-xl transition-all duration-300 group">
<span class="material-symbols-outlined absolute left-4 text-zinc-500 group-focus-within:text-primary" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-white placeholder-zinc-600 focus:ring-0 font-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Sign In Button -->
<button class="w-full btn-gradient py-4 rounded-xl font-headline-md text-white tracking-wide active:scale-[0.98] transition-all duration-200">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 text-zinc-600 font-label-caps text-[10px]">SECURE BIOMETRIC</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Biometric Login Button -->
<button class="w-full flex items-center justify-center gap-3 py-4 border border-white/10 rounded-xl bg-white/5 hover:bg-white/10 active:scale-[0.98] transition-all duration-300" type="button">
<span class="material-symbols-outlined text-primary" data-icon="fingerprint" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-label-caps text-label-caps text-on-surface">Secure Biometric Login</span>
</button>
</form>
</div>
<!-- External Link Footer -->
<footer class="mt-12 text-center">
<p class="text-zinc-500 font-body-md text-sm">
                New to the platform? 
                <a class="text-primary font-medium hover:underline ml-1" href="#">College/Organization Enrollment</a>
</p>
<div class="mt-8 flex justify-center gap-6">
<span class="text-zinc-700 font-label-caps text-[10px]">TLS 1.3 ENCRYPTED</span>
<span class="text-zinc-700 font-label-caps text-[10px]">SOC2 COMPLIANT</span>
<span class="text-zinc-700 font-label-caps text-[10px]">GDPR PROTECTED</span>
</div>
